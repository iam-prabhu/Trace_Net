<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@page { size: landscape A4; margin: 10mm; }
body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background: #ffffff; }
svg { width: 100%; height: auto; max-width: 1050px; }
</style>
</head>
<body>
<svg viewBox="0 0 1100 860" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="actor-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="usecase-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="usecase-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>
    <linearGradient id="usecase-grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <linearGradient id="usecase-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="usecase-grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="1060" height="45" rx="8" fill="url(#header-grad)" filter="url(#shadow)"/>
  <text x="550" y="43" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">UML USE CASE DIAGRAM: COLLABORATIVE GRAPH-BASED FRAUD DETECTION CONSOLE</text>

  <!-- System Boundary Box -->
  <rect x="230" y="75" width="640" height="765" rx="14" fill="#fcfcfd" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <rect x="230" y="75" width="310" height="28" rx="4" fill="#eff6ff"/>
  <text x="245" y="94" font-size="11" font-weight="800" fill="#1e40af" letter-spacing="1">SYSTEM BOUNDARY: FRAUD DETECTION CONSOLE</text>

  <!-- ==================== LEFT ACTORS ==================== -->

  <!-- Actor 1: Lead Forensic Analyst -->
  <g transform="translate(110, 190)" filter="url(#actor-shadow)">
    <!-- Stick Figure -->
    <circle cx="0" cy="-28" r="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
    <line x1="0" y1="-14" x2="0" y2="20" stroke="#1d4ed8" stroke-width="2.2"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#1d4ed8" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="-16" y2="46" stroke="#1d4ed8" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="16" y2="46" stroke="#1d4ed8" stroke-width="2.2"/>
    <text x="0" y="66" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Lead Forensic</text>
    <text x="0" y="80" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Investigator</text>
  </g>

  <!-- Actor 2: Collaborative Analyst (Peer) -->
  <g transform="translate(110, 430)" filter="url(#actor-shadow)">
    <circle cx="0" cy="-28" r="14" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
    <line x1="0" y1="-14" x2="0" y2="20" stroke="#059669" stroke-width="2.2"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#059669" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="-16" y2="46" stroke="#059669" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="16" y2="46" stroke="#059669" stroke-width="2.2"/>
    <text x="0" y="66" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Collaborative</text>
    <text x="0" y="80" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Peer Analyst</text>
  </g>

  <!-- Generalization Arrow (Peer inherits Investigator) -->
  <line x1="110" y1="390" x2="110" y2="295" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="105,295 110,283 115,295" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>

  <!-- Actor 3: Compliance & AML Officer -->
  <g transform="translate(110, 680)" filter="url(#actor-shadow)">
    <circle cx="0" cy="-28" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="0" y1="-14" x2="0" y2="20" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="-16" y2="46" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="16" y2="46" stroke="#7c3aed" stroke-width="2.2"/>
    <text x="0" y="66" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Compliance /</text>
    <text x="0" y="80" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">AML Officer</text>
  </g>

  <!-- ==================== RIGHT ACTORS ==================== -->

  <!-- Actor 4: System Administrator -->
  <g transform="translate(990, 190)" filter="url(#actor-shadow)">
    <circle cx="0" cy="-28" r="14" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
    <line x1="0" y1="-14" x2="0" y2="20" stroke="#475569" stroke-width="2.2"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#475569" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="-16" y2="46" stroke="#475569" stroke-width="2.2"/>
    <line x1="0" y1="20" x2="16" y2="46" stroke="#475569" stroke-width="2.2"/>
    <text x="0" y="66" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Security &amp; System</text>
    <text x="0" y="80" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Administrator</text>
  </g>

  <!-- System Actor 5: WebSocket Real-Time Gateway -->
  <g transform="translate(990, 450)" filter="url(#actor-shadow)">
    <rect x="-65" y="-30" width="130" height="55" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="-12" font-size="9" font-weight="bold" fill="#0369a1" text-anchor="middle">&laquo;System Actor&raquo;</text>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">WebSocket Bus</text>
    <text x="0" y="18" font-size="9.5" fill="#64748b" text-anchor="middle">(Socket.IO)</text>
  </g>

  <!-- System Actor 6: Neo4j / In-Memory Compute Engine -->
  <g transform="translate(990, 680)" filter="url(#actor-shadow)">
    <rect x="-65" y="-30" width="130" height="55" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-12" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">&laquo;System Actor&raquo;</text>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Graph Analytics</text>
    <text x="0" y="18" font-size="9.5" fill="#64748b" text-anchor="middle">(Neo4j + GCN)</text>
  </g>


  <!-- ==================== USE CASES (OVALS) ==================== -->

  <!-- UC1: Authenticate & Authorize -->
  <g transform="translate(400, 125)">
    <ellipse cx="0" cy="0" rx="100" ry="24" fill="url(#usecase-grad-blue)" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Authenticate &amp; RBAC</text>
  </g>

  <!-- UC2: Search & Query Account / Txn -->
  <g transform="translate(400, 195)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="url(#usecase-grad-blue)" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Search Accounts &amp; Txns</text>
  </g>

  <!-- UC3: Multi-Hop Traversal (BFS/DFS) -->
  <g transform="translate(400, 270)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#usecase-grad-blue)" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-2" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">Trace Multi-Hop Paths</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#3b82f6" text-anchor="middle">(BFS / DFS Traversal)</text>
  </g>

  <!-- UC3-Ext: Filter by Amount / Date -->
  <g transform="translate(700, 270)">
    <ellipse cx="0" cy="0" rx="105" ry="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Filter Amount &amp; Dates</text>
  </g>

  <!-- UC4: Cycle Detection (Johnson's) -->
  <g transform="translate(400, 355)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#usecase-grad-red)" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-2" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Detect Circular Rings</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#dc2626" text-anchor="middle">(Tarjan SCC + Johnson's)</text>
  </g>

  <!-- UC4-Inc: Compute Ring Anomaly Score -->
  <g transform="translate(700, 355)">
    <ellipse cx="0" cy="0" rx="105" ry="24" fill="#ffffff" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">Score Ring Risk Factor</text>
  </g>

  <!-- UC5: Louvain Modularity -->
  <g transform="translate(400, 440)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#usecase-grad-purple)" stroke="#9333ea" stroke-width="2"/>
    <text x="0" y="-2" font-size="11.5" font-weight="800" fill="#581c87" text-anchor="middle">Partition Communities</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#9333ea" text-anchor="middle">(Louvain Modularity Clust.)</text>
  </g>

  <!-- UC6: GCN Neural Anomaly Prediction -->
  <g transform="translate(400, 525)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#usecase-grad-purple)" stroke="#4f46e5" stroke-width="2"/>
    <text x="0" y="-2" font-size="11.5" font-weight="800" fill="#312e81" text-anchor="middle">Predict GCN Anomaly Risk</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#4f46e5" text-anchor="middle">(2-Layer Spectral ML)</text>
  </g>

  <!-- UC6-Inc: Explain Feature Attribution -->
  <g transform="translate(700, 525)">
    <ellipse cx="0" cy="0" rx="105" ry="24" fill="#ffffff" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#3730a3" text-anchor="middle">Explain Attribution Weights</text>
  </g>

  <!-- UC7: 3D Geospatial Havens -->
  <g transform="translate(400, 610)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#usecase-grad-green)" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-2" font-size="11.5" font-weight="800" fill="#14532d" text-anchor="middle">Project Geospatial Havens</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#16a34a" text-anchor="middle">(3D WebGL Flight Arcs)</text>
  </g>

  <!-- UC8: Manage Active Case & Collaborate -->
  <g transform="translate(400, 695)">
    <ellipse cx="0" cy="0" rx="130" ry="30" fill="url(#usecase-grad-green)" stroke="#059669" stroke-width="2"/>
    <text x="0" y="-3" font-size="12" font-weight="800" fill="#064e3b" text-anchor="middle">Synchronize Live Canvas</text>
    <text x="0" y="13" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">(Pan, Zoom, Highlight, Room)</text>
  </g>

  <!-- UC8-Ext: Share Case Annotations -->
  <g transform="translate(700, 695)">
    <ellipse cx="0" cy="0" rx="105" ry="24" fill="#ffffff" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">Add Shared Annotations</text>
  </g>

  <!-- UC9: Export SAR Dossier -->
  <g transform="translate(400, 780)">
    <ellipse cx="0" cy="0" rx="120" ry="26" fill="url(#usecase-grad-amber)" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="4" font-size="11.5" font-weight="800" fill="#78350f" text-anchor="middle">Export Legal SAR Dossier</text>
  </g>

  <!-- UC10: Benchmark & Evaluate ROC-AUC -->
  <g transform="translate(700, 780)">
    <ellipse cx="0" cy="0" rx="110" ry="26" fill="url(#usecase-grad-amber)" stroke="#b45309" stroke-width="1.8"/>
    <text x="0" y="4" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">Evaluate ROC-AUC &amp; Latency</text>
  </g>


  <!-- ==================== ASSOCIATIONS (ACTOR -> USE CASE) ==================== -->

  <!-- Lead Analyst Associations -->
  <line x1="145" y1="180" x2="285" y2="195" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="145" y1="190" x2="275" y2="270" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="145" y1="200" x2="275" y2="355" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="145" y1="210" x2="275" y2="440" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="145" y1="220" x2="275" y2="525" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="145" y1="230" x2="280" y2="610" stroke="#1d4ed8" stroke-width="1.6"/>

  <!-- Collaborative Analyst Associations -->
  <line x1="145" y1="430" x2="275" y2="270" stroke="#059669" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="145" y1="440" x2="275" y2="355" stroke="#059669" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="145" y1="450" x2="270" y2="695" stroke="#059669" stroke-width="1.6"/>
  <line x1="145" y1="460" x2="285" y2="780" stroke="#059669" stroke-width="1.4"/>

  <!-- Compliance Officer Associations -->
  <line x1="145" y1="670" x2="285" y2="610" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="145" y1="680" x2="280" y2="780" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="145" y1="690" x2="590" y2="780" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Admin Associations -->
  <line x1="935" y1="180" x2="500" y2="125" stroke="#475569" stroke-width="1.5"/>
  <line x1="935" y1="200" x2="780" y2="760" stroke="#475569" stroke-width="1.5"/>

  <!-- System Actor: WebSocket Bus Associations -->
  <line x1="925" y1="460" x2="530" y2="695" stroke="#0284c7" stroke-width="1.6"/>

  <!-- System Actor: Graph Engine Associations -->
  <line x1="925" y1="670" x2="525" y2="270" stroke="#d97706" stroke-width="1.4"/>
  <line x1="925" y1="680" x2="525" y2="355" stroke="#d97706" stroke-width="1.4"/>
  <line x1="925" y1="690" x2="525" y2="440" stroke="#d97706" stroke-width="1.4"/>
  <line x1="925" y1="700" x2="525" y2="525" stroke="#d97706" stroke-width="1.4"/>


  <!-- ==================== <<include>> & <<extend>> RELATIONSHIPS ==================== -->

  <!-- UC3 -> UC3-Ext (<<extend>>) -->
  <line x1="525" y1="270" x2="595" y2="270" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="535,266 525,270 535,274" fill="#64748b"/>
  <text x="560" y="263" font-size="8.5" font-weight="bold" fill="#64748b" text-anchor="middle">&laquo;extend&raquo;</text>

  <!-- UC4 -> UC4-Inc (<<include>>) -->
  <line x1="525" y1="355" x2="595" y2="355" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="585,351 595,355 585,359" fill="#dc2626"/>
  <text x="560" y="348" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">&laquo;include&raquo;</text>

  <!-- UC6 -> UC6-Inc (<<include>>) -->
  <line x1="525" y1="525" x2="595" y2="525" stroke="#4f46e5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="585,521 595,525 585,529" fill="#4f46e5"/>
  <text x="560" y="518" font-size="8.5" font-weight="bold" fill="#4f46e5" text-anchor="middle">&laquo;include&raquo;</text>

  <!-- UC8 -> UC8-Ext (<<extend>>) -->
  <line x1="530" y1="695" x2="595" y2="695" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="540,691 530,695 540,699" fill="#059669"/>
  <text x="562" y="688" font-size="8.5" font-weight="bold" fill="#059669" text-anchor="middle">&laquo;extend&raquo;</text>

</svg>
</body>
</html>
