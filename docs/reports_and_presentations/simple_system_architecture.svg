<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08" flood-color="#0f172a"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="g-ui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <linearGradient id="g-collab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="g-algo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="g-data" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-updown" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="920" height="48" rx="8" fill="url(#header-grad)"/>
  <text x="500" y="55" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SIMPLIFIED SYSTEM ARCHITECTURE</text>

  <!-- STAGE 1: FRONTEND (UI) -->
  <g transform="translate(40, 95)" filter="url(#card-shadow)">
    <rect width="920" height="95" rx="10" fill="url(#g-ui)" stroke="#3b82f6" stroke-width="1.8"/>
    <rect width="180" height="24" rx="4" fill="#3b82f6"/>
    <text x="90" y="16" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1. ANALYST WORKSTATION</text>
    
    <!-- Sub cards -->
    <rect x="25" y="34" width="265" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="157" y="54" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Interactive Graph Canvas</text>
    <text x="157" y="69" font-size="10" fill="#64748b" text-anchor="middle">Visualizes accounts, transactions &amp; rings</text>

    <rect x="325" y="34" width="270" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="460" y="54" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">3D Geospatial Globe</text>
    <text x="460" y="69" font-size="10" fill="#64748b" text-anchor="middle">Traces cross-border flight to tax havens</text>

    <rect x="630" y="34" width="265" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="762" y="54" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Case &amp; Dossier Manager</text>
    <text x="762" y="69" font-size="10" fill="#64748b" text-anchor="middle">Exports legal Suspicious Activity Reports (SAR)</text>
  </g>

  <!-- Connective Arrows 1 -> 2 -->
  <line x1="300" y1="190" x2="300" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="700" y2="215" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-updown)"/>
  <text x="310" y="206" font-size="9.5" font-weight="700" fill="#2563eb">REST API Requests</text>
  <text x="710" y="206" font-size="9.5" font-weight="700" fill="#059669">Real-Time Sync (WebSocket)</text>

  <!-- STAGE 2: COLLABORATION & API GATEWAY -->
  <g transform="translate(40, 220)" filter="url(#card-shadow)">
    <rect width="920" height="90" rx="10" fill="url(#g-collab)" stroke="#10b981" stroke-width="1.8"/>
    <rect width="210" height="24" rx="4" fill="#059669"/>
    <text x="105" y="16" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2. COLLABORATION &amp; GATEWAY</text>

    <rect x="40" y="34" width="400" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="240" y="52" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Express.js API Gateway &amp; Auth (RBAC)</text>
    <text x="240" y="66" font-size="10" fill="#64748b" text-anchor="middle">Validates users, routes requests &amp; enforces security</text>

    <rect x="480" y="34" width="400" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="680" y="52" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Socket.IO Live Sync Engine</text>
    <text x="680" y="66" font-size="10" fill="#64748b" text-anchor="middle">Syncs canvas pan/zoom, shared pins &amp; live presence</text>
  </g>

  <!-- Connective Arrows 2 -> 3 -->
  <line x1="500" y1="310" x2="500" y2="335" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="326" font-size="9.5" font-weight="700" fill="#7c3aed">Executes Algorithms</text>

  <!-- STAGE 3: DETECTION BRAIN (ALGORITHMIC CORE) -->
  <g transform="translate(40, 340)" filter="url(#card-shadow)">
    <rect width="920" height="110" rx="10" fill="url(#g-algo)" stroke="#7c3aed" stroke-width="1.8"/>
    <rect width="220" height="24" rx="4" fill="#7c3aed"/>
    <text x="110" y="16" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3. FRAUD DETECTION CORE (BRAIN)</text>

    <!-- 4 Clear Algorithmic Pillars -->
    <rect x="25" y="34" width="200" height="62" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="125" y="53" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Multi-Hop Traversal</text>
    <text x="125" y="67" font-size="9.5" font-weight="600" fill="#2563eb" text-anchor="middle">BFS / DFS Algorithms</text>
    <text x="125" y="82" font-size="9" fill="#64748b" text-anchor="middle">Traces money mule chains</text>

    <rect x="250" y="34" width="205" height="62" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="352" y="53" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Cycle Detection</text>
    <text x="352" y="67" font-size="9.5" font-weight="600" fill="#dc2626" text-anchor="middle">Johnson's + Tarjan's SCC</text>
    <text x="352" y="82" font-size="9" fill="#64748b" text-anchor="middle">Catches circular wash rings</text>

    <rect x="480" y="34" width="205" height="62" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="582" y="53" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Community Clustering</text>
    <text x="582" y="67" font-size="9.5" font-weight="600" fill="#9333ea" text-anchor="middle">Louvain Modularity</text>
    <text x="582" y="82" font-size="9" fill="#64748b" text-anchor="middle">Finds collusive fraud syndicates</text>

    <rect x="710" y="34" width="185" height="62" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="802" y="53" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Graph Neural Net</text>
    <text x="802" y="67" font-size="9.5" font-weight="600" fill="#4f46e5" text-anchor="middle">2-Layer Spectral GCN</text>
    <text x="802" y="82" font-size="9" fill="#64748b" text-anchor="middle">Predicts fraud probability (0-100%)</text>
  </g>

  <!-- Connective Arrows 3 -> 4 -->
  <line x1="500" y1="450" x2="500" y2="475" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="466" font-size="9.5" font-weight="700" fill="#d97706">Loads Graph &amp; Queries</text>

  <!-- STAGE 4: DATABASE & STORAGE LAYER -->
  <g transform="translate(40, 480)" filter="url(#card-shadow)">
    <rect width="920" height="85" rx="10" fill="url(#g-data)" stroke="#d97706" stroke-width="1.8"/>
    <rect width="180" height="24" rx="4" fill="#d97706"/>
    <text x="90" y="16" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4. STORAGE &amp; DATA LAYER</text>

    <rect x="50" y="32" width="390" height="42" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="245" y="49" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Neo4j Graph Database (Persistent Store)</text>
    <text x="245" y="63" font-size="9.5" fill="#64748b" text-anchor="middle">Stores accounts, directed transaction ledgers &amp; Cypher indexes</text>

    <rect x="480" y="32" width="390" height="42" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="675" y="49" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">In-Memory Adjacency Matrix (Compute Engine)</text>
    <text x="675" y="63" font-size="9.5" fill="#64748b" text-anchor="middle">Fast typed float array enabling sub-millisecond algorithm speed</text>
  </g>
</svg>