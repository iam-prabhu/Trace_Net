<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#312E81" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Outer Shield Badge -->
  <path d="M32 4L10 12V28C10 43.5 19.5 54.5 32 60C44.5 54.5 54 43.5 54 28V12L32 4Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Shield Inset Border -->
  <path d="M32 8.5L14 15V28C14 40.8 21.8 49.8 32 55.2C42.2 49.8 50 40.8 50 28V15L32 8.5Z" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Graph Network Topology inside Shield -->
  <line x1="32" y1="20" x2="21" y2="32" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="43" y2="32" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="32" y2="44" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="43" y1="32" x2="32" y2="44" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="43" y2="32" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Radar Scope Wave -->
  <circle cx="32" cy="32" r="7" stroke="#67E8F9" stroke-width="1.5" stroke-opacity="0.9" fill="#38BDF8" fill-opacity="0.2"/>
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF"/>

  <!-- Graph Nodes -->
  <circle cx="32" cy="20" r="3.8" fill="#FFFFFF"/>
  <circle cx="32" cy="20" r="2" fill="#2563EB"/>

  <circle cx="21" cy="32" r="3.2" fill="#38BDF8"/>
  <circle cx="43" cy="32" r="3.2" fill="#38BDF8"/>

  <!-- Flagged Fraud Node (Apex Alert) -->
  <circle cx="32" cy="44" r="4.2" fill="#FFFFFF"/>
  <circle cx="32" cy="44" r="2.4" fill="#EF4444"/>
</svg>
